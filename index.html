<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple sequence list</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<script src="script.js" defer></script>
<body>
    <h2 id="tittle">This is a simple sequence list</h2>
    <h3 id="description">The idea includes to do a simple sequence list for a random avaliation, like how many stars does it have?</h3>
    <div id="containerbar">

         <div id="yellowbar"></div>

         <img id="barimage" src="img/StarComb.png">

    </div>
    <h3 id="nota"></h3>
    <button id="fiveAv" onclick="avaliate(5)"> Five stars</button>
    <button id="fourAv" onclick="avaliate(4)"> Four stars</button>
    <button id="threeAv" onclick="avaliate(3)"> Three stars</button>
    <button id="twoAv" onclick="avaliate(2)"> Two stars</button>
    <button id="oneAv" onclick="avaliate(1)"> One star</button>
    <button id="zeroAv" onclick="avaliate(0)"> Zero stars</button>
</body>
</html>
